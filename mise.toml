# Modified for Classic Beans.

[tools]
go = "latest"
svu = "latest"

[tasks.test]
run = "go test ./..."

[tasks.build]
run = """
LDFLAGS="\
  -X github.com/50lo/classic-beans/internal/version.Version=$(git describe --tags --always --dirty 2>/dev/null || echo dev) \
  -X github.com/50lo/classic-beans/internal/version.Commit=$(git rev-parse --short HEAD 2>/dev/null || echo unknown) \
  -X github.com/50lo/classic-beans/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
go build -ldflags "$LDFLAGS" -o cbeans ./cmd/cbeans
"""

[tasks.cbeans]
alias = "beans"
description = "Build and run the Classic Beans CLI"
run = "go run ./cmd/cbeans"

[tasks.install]
depends = "build"
run = "cp cbeans ~/bin/cbeans"

[tasks."release:patch"]
description = "Create a patch version tag (e.g., v0.1.4 → v0.1.5)"
run = """
set -e
NEW_VERSION=$(svu patch)
git tag "$NEW_VERSION"
echo "Created tag: $NEW_VERSION"
echo "To release, run: git push && git push --tags"
"""

[tasks."release:minor"]
description = "Create a minor version tag (e.g., v0.1.4 → v0.2.0)"
run = """
set -e
NEW_VERSION=$(svu minor)
git tag "$NEW_VERSION"
echo "Created tag: $NEW_VERSION"
echo "To release, run: git push && git push --tags"
"""

[tasks."release:major"]
description = "Create a major version tag (e.g., v0.1.4 → v1.0.0)"
run = """
set -e
NEW_VERSION=$(svu major)
git tag "$NEW_VERSION"
echo "Created tag: $NEW_VERSION"
echo "To release, run: git push && git push --tags"
"""
